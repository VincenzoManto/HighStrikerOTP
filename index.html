<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>High Striker OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Inter:wght@400;600&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Prevent pull-to-refresh on mobile */
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #canvas-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* Shake animation for bell hit */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake-active {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Screen flash */
        #flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: red;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.5s ease-out;
        }
        .flash-active {
            opacity: 0.4 !important;
            transition: opacity 0.05s ease-in !important;
        }

        .font-mono-num {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>

<div id="game-container">
    
    <!-- Red flash overlay for errors -->
    <div id="flash-overlay"></div>

    <!-- Global Counter -->
    <div class="absolute top-6 right-6 z-30 flex items-center gap-3 bg-[#1e1e1e] border border-[#333] px-4 py-2 rounded-full shadow-lg">
        <div class="w-2.5 h-2.5 rounded-full bg-orange-500" style="box-shadow: 0 0 8px #f97316;"></div>
        <div class="text-sm text-gray-300 tracking-wide font-mono-num">
            <span id="global-counter" class="text-white font-bold text-base mr-1">0</span> OTPs entered
        </div>
    </div>

    <!-- OTP Display Slots -->
    <div class="absolute top-24 z-30 flex gap-2 sm:gap-4 pointer-events-none" id="otp-slots">
        <!-- Slots generated by JS -->
    </div>

    <!-- Helper Text (Fades out when interacting) -->
    <div id="hint-text" class="absolute bottom-10 z-30 text-gray-500 text-sm tracking-widest uppercase pointer-events-none transition-opacity duration-500">
        Drag down to set power
    </div>

    <!-- Game Canvas -->
    <div id="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

</div>

<script>
    // Configuration & State
    const MAX_OTP_LENGTH = 6;
    let currentOtp = [];
    let isGameOver = false;

    // Canvas Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    let cw, ch;

    // Global Counter Logic - Deterministico, circa 2 al minuto
    const startTimeUTC = Date.UTC(2026, 8, 18, 12, 2, 0); // 18/09/2026 12:02:00 UTC (14:02 CEST)
    const counterEl = document.getElementById('global-counter');
    
    // Generatore di numeri pseudo-casuali (PRNG) seed-abile
    function mulberry32(a) {
        return function() {
          var t = a += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }
    }

    let cachedTotal = 0;
    let cachedMinute = -1;

    function calculateDeterministicOTPs() {
        const now = Date.now();
        if (now <= startTimeUTC) return 0;
        
        const elapsedMinutes = Math.floor((now - startTimeUTC) / (1000 * 60));
        const elapsedSeconds = Math.floor(((now - startTimeUTC) % (1000 * 60)) / 1000);
        
        let total = 0;
        
        // Ottimizzazione: calcola il totale dei minuti passati solo se il minuto è cambiato
        if (elapsedMinutes === cachedMinute) {
            total = cachedTotal;
        } else {
            for (let i = 0; i < elapsedMinutes; i++) {
                const rng = mulberry32(startTimeUTC + i);
                // Genera da 1 a 3 eventi per minuto (media 2)
                total += Math.floor(rng() * 3) + 1; 
            }
            cachedMinute = elapsedMinutes;
            cachedTotal = total;
        }
        
        let currentTotal = total;
        
        // Calcola per il minuto corrente (frazioni di minuto)
        const currentMinuteRNG = mulberry32(startTimeUTC + elapsedMinutes);
        const eventsThisMinute = Math.floor(currentMinuteRNG() * 3) + 1;
        
        // Distribuisce gli eventi del minuto corrente proporzionalmente ai secondi passati
        for (let i = 1; i <= eventsThisMinute; i++) {
            const triggerSecond = Math.floor((60 / (eventsThisMinute + 1)) * i);
            if (elapsedSeconds >= triggerSecond) {
                currentTotal++;
            }
        }
        
        return currentTotal;
    }

    function updateCounterDisplay() {
        counterEl.textContent = calculateDeterministicOTPs().toLocaleString('en-US');
    }

    // Inizializza e aggiorna ogni secondo per vedere il contatore salire in tempo reale
    updateCounterDisplay();
    setInterval(updateCounterDisplay, 1000);

    // Resize Handler for crisp rendering
    function resize() {
        cw = window.innerWidth;
        ch = window.innerHeight;
        // Handle high DPI displays
        const dpr = window.devicePixelRatio || 1;
        canvas.width = cw * dpr;
        canvas.height = ch * dpr;
        ctx.scale(dpr, dpr);
        canvas.style.width = `${cw}px`;
        canvas.style.height = `${ch}px`;
        
        initGameDimensions();
    }
    window.addEventListener('resize', resize);

    // UI OTP Slots setup
    const slotsContainer = document.getElementById('otp-slots');
    for (let i = 0; i < MAX_OTP_LENGTH; i++) {
        const slot = document.createElement('div');
        slot.className = `w-12 h-16 sm:w-16 sm:h-20 bg-[#1a1a1a] border-2 border-[#333] rounded-xl flex items-center justify-center text-3xl sm:text-4xl font-mono-num text-orange-500 shadow-[inset_0_4px_10px_rgba(0,0,0,0.5)] transition-all duration-300`;
        slot.id = `slot-${i}`;
        slotsContainer.appendChild(slot);
    }

    function updateOtpDisplay() {
        for (let i = 0; i < MAX_OTP_LENGTH; i++) {
            const slot = document.getElementById(`slot-${i}`);
            if (i < currentOtp.length) {
                slot.textContent = currentOtp[i];
                slot.classList.add('border-orange-500', 'shadow-[0_0_15px_rgba(249,115,22,0.3)]');
                slot.classList.remove('border-[#333]');
            } else {
                slot.textContent = '';
                slot.classList.remove('border-orange-500', 'shadow-[0_0_15px_rgba(249,115,22,0.3)]', 'border-red-500', 'border-green-500');
                slot.classList.add('border-[#333]');
            }
            
            // Highlight active slot
            if (i === currentOtp.length && !isGameOver) {
                slot.classList.add('border-gray-500');
            } else if (i !== currentOtp.length) {
                slot.classList.remove('border-gray-500');
            }
        }
    }
    updateOtpDisplay();

    // Game Entities
    const Game = {
        tower: { x: 0, y: 0, w: 20, h: 0 },
        zones: [], // Heights for digits 0-9
        bell: { x: 0, y: 0, r: 25 },
        puck: { x: 0, y: 0, baseY: 0, r: 15, vy: 0, state: 'idle', highestY: 0, scored: false },
        hammer: { x: 0, y: 0, w: 60, h: 20, pull: 0, maxPull: 200, isDragging: false },
        physics: {
            gravity: 0.6,
            powerMultiplier: 0.18 // Tunes how high it goes based on pull
        },
        particles: []
    };

    function initGameDimensions() {
        // Tower sizing
        Game.tower.w = cw > 600 ? 24 : 16;
        Game.tower.h = ch * 0.55; // 55% of screen height
        Game.tower.x = cw / 2 - Game.tower.w / 2;
        Game.tower.y = ch * 0.3; // Starts 30% from top

        // Base/Hammer positions
        const baseY = Game.tower.y + Game.tower.h;
        Game.puck.baseY = baseY - Game.puck.r;
        if(Game.puck.state === 'idle') {
            Game.puck.x = cw / 2;
            Game.puck.y = Game.puck.baseY;
        }

        Game.hammer.w = Game.tower.w * 3;
        Game.hammer.x = cw / 2 - Game.hammer.w / 2;
        Game.hammer.y = baseY + 20;

        // Calculate zones (0 at bottom, 9 at top)
        Game.zones = [];
        const zoneHeight = Game.tower.h / 10;
        for (let i = 0; i < 10; i++) {
            Game.zones.push({
                val: i,
                top: baseY - (i + 1) * zoneHeight,
                bottom: baseY - i * zoneHeight,
                center: baseY - (i + 0.5) * zoneHeight
            });
        }

        // Bell setup
        Game.bell.x = cw / 2;
        Game.bell.y = Game.tower.y - 10;
        Game.bell.r = Game.tower.w * 1.5;
    }

    let startDragY = 0;

    function handlePointerDown(e) {
        if (isGameOver || Game.puck.state !== 'idle') return;
        
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        // Allow dragging anywhere on the bottom half
        if (clientY > ch * 0.4) {
            Game.hammer.isDragging = true;
            startDragY = clientY;
            document.getElementById('hint-text').style.opacity = '0';
        }
    }

    function handlePointerMove(e) {
        if (!Game.hammer.isDragging) return;
        // Prevent default scrolling
        if(e.cancelable) e.preventDefault(); 

        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const deltaY = clientY - startDragY;
        
        // Update pull distance, constrained between 0 and maxPull
        Game.hammer.pull = Math.max(0, Math.min(deltaY, Game.hammer.maxPull));
    }

    function handlePointerUp() {
        if (!Game.hammer.isDragging) return;
        Game.hammer.isDragging = false;

        // Launch if pulled enough
        if (Game.hammer.pull > 20) {
            Game.puck.state = 'shooting';
            // Velocity relates linearly to pull. Height reached will be proportional to pull squared.
            Game.puck.vy = -Game.hammer.pull * Game.physics.powerMultiplier;
            Game.puck.highestY = Game.puck.y;
            Game.puck.scored = false;
        }
        
        // Snap hammer back
        Game.hammer.pull = 0;
    }

    // Attach listeners
    canvas.addEventListener('mousedown', handlePointerDown);
    window.addEventListener('mousemove', handlePointerMove, {passive: false});
    window.addEventListener('mouseup', handlePointerUp);
    
    canvas.addEventListener('touchstart', handlePointerDown, {passive: false});
    window.addEventListener('touchmove', handlePointerMove, {passive: false});
    window.addEventListener('touchend', handlePointerUp);

    function createParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            Game.particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10 - 2,
                life: 1.0,
                color: color,
                size: Math.random() * 4 + 2
            });
        }
    }

    function triggerFail() {
        const flash = document.getElementById('flash-overlay');
        const container = document.getElementById('game-container');
        
        flash.classList.add('flash-active');
        container.classList.add('shake-active');
        
        createParticles(Game.bell.x, Game.bell.y, '#ef4444', 30); // Red explosion
        
        // Mark current slots as red briefly
        for(let i=0; i<currentOtp.length; i++){
            document.getElementById(`slot-${i}`).classList.add('border-red-500', 'text-red-500');
        }

        setTimeout(() => {
            flash.classList.remove('flash-active');
            container.classList.remove('shake-active');
            currentOtp = [];
            updateOtpDisplay();
        }, 400);
    }

    function triggerSuccess() {
        isGameOver = true;
        for (let i = 0; i < MAX_OTP_LENGTH; i++) {
            const slot = document.getElementById(`slot-${i}`);
            slot.classList.remove('border-orange-500');
            slot.classList.add('border-green-500', 'text-green-500', 'shadow-[0_0_20px_rgba(34,197,94,0.5)]');
        }
        
        // Reset after delay
        setTimeout(() => {
            currentOtp = [];
            isGameOver = false;
            updateOtpDisplay();
            for (let i = 0; i < MAX_OTP_LENGTH; i++) {
                const slot = document.getElementById(`slot-${i}`);
                slot.classList.remove('border-green-500', 'text-green-500', 'shadow-[0_0_20px_rgba(34,197,94,0.5)]');
            }
        }, 2000);
    }

    function update() {
        // Particles logic
        for (let i = Game.particles.length - 1; i >= 0; i--) {
            let p = Game.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // gravity for particles
            p.life -= 0.03;
            if (p.life <= 0) Game.particles.splice(i, 1);
        }

        if (Game.puck.state === 'shooting') {
            Game.puck.vy += Game.physics.gravity;
            Game.puck.y += Game.puck.vy;

            // Track highest point reached (min Y)
            if (Game.puck.y < Game.puck.highestY) {
                Game.puck.highestY = Game.puck.y;
            }

            // Apex detection: velocity changes from negative (up) to positive (down)
            if (Game.puck.vy > 0 && !Game.puck.scored) {
                Game.puck.scored = true; // Process score once per shot

                const apexY = Game.puck.highestY;
                let hitZone = -1;

                // Did it hit the bell?
                if (apexY <= Game.bell.y + Game.bell.r) {
                    triggerFail();
                } else {
                    // Check which zone it peaked in
                    for (let z of Game.zones) {
                        if (apexY >= z.top && apexY <= z.bottom) {
                            hitZone = z.val;
                            break;
                        }
                    }

                    if (hitZone !== -1) {
                        // Success! Add digit
                        createParticles(Game.puck.x, apexY, '#f97316', 15);
                        currentOtp.push(hitZone);
                        updateOtpDisplay();

                        if (currentOtp.length === MAX_OTP_LENGTH) {
                            triggerSuccess();
                        }
                    } else if (apexY > Game.zones[0].bottom) {
                        // Didn't even reach zero. Too weak.
                         createParticles(Game.puck.x, Game.puck.baseY, '#6b7280', 5);
                    }
                }
            }

            // Reset puck when it falls back down
            if (Game.puck.y >= Game.puck.baseY) {
                Game.puck.y = Game.puck.baseY;
                Game.puck.vy = 0;
                Game.puck.state = 'idle';
            }
        }
    }

    function draw() {
        // Clear background
        ctx.fillStyle = '#121212';
        ctx.fillRect(0, 0, cw, ch);

        // Draw background grid (aesthetic)
        ctx.strokeStyle = '#1e1e1e';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for(let i = 0; i < cw; i += 50) { ctx.moveTo(i, 0); ctx.lineTo(i, ch); }
        for(let i = 0; i < ch; i += 50) { ctx.moveTo(0, i); ctx.lineTo(cw, i); }
        ctx.stroke();

        // 1. Draw Tower
        ctx.fillStyle = '#222';
        ctx.fillRect(Game.tower.x, Game.tower.y, Game.tower.w, Game.tower.h);
        
        // Inner track groove
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(Game.tower.x + 4, Game.tower.y, Game.tower.w - 8, Game.tower.h);

        // 2. Draw Zones and Numbers
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 18px "JetBrains Mono"';
        
        Game.zones.forEach(z => {
            // Zone dividers
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(Game.tower.x - 5, z.bottom);
            ctx.lineTo(Game.tower.x + Game.tower.w + 5, z.bottom);
            ctx.stroke();

            // Number logic mapping
            // Highlight the zone the puck is currently in or reached
            let isHighlight = false;
            if (Game.puck.state === 'shooting' && Game.puck.highestY <= z.bottom && Game.puck.highestY >= z.top) {
                isHighlight = true;
            }

            // Draw number
            ctx.fillStyle = isHighlight ? '#f97316' : '#555';
            ctx.fillText(z.val, Game.tower.x - 15, z.center);
            
            // Add slight glow if highlighted
            if(isHighlight) {
                ctx.shadowColor = '#f97316';
                ctx.shadowBlur = 10;
                ctx.fillRect(Game.tower.x + 4, z.top, Game.tower.w - 8, z.bottom - z.top);
                ctx.shadowBlur = 0;
            }
        });

        // 3. Draw Bell
        ctx.beginPath();
        ctx.arc(Game.bell.x, Game.bell.y, Game.bell.r, Math.PI, 0);
        ctx.lineTo(Game.bell.x + Game.bell.r, Game.bell.y + 10);
        ctx.lineTo(Game.bell.x - Game.bell.r, Game.bell.y + 10);
        ctx.closePath();
        
        // Danger zone gradient for bell
        let bellGrad = ctx.createLinearGradient(0, Game.bell.y - Game.bell.r, 0, Game.bell.y + 10);
        bellGrad.addColorStop(0, '#ef4444');
        bellGrad.addColorStop(1, '#991b1b');
        ctx.fillStyle = bellGrad;
        
        // Glow effect if close
        if (Game.puck.state === 'shooting' && Game.puck.y < Game.tower.y + 50) {
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 20;
        }
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Bell clapper
        ctx.fillStyle = '#fca5a5';
        ctx.beginPath();
        ctx.arc(Game.bell.x, Game.bell.y + 12, 6, 0, Math.PI * 2);
        ctx.fill();

        // 4. Draw Base
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.moveTo(Game.tower.x - 20, Game.puck.baseY + 15);
        ctx.lineTo(Game.tower.x + Game.tower.w + 20, Game.puck.baseY + 15);
        ctx.lineTo(Game.tower.x + Game.tower.w + 40, ch);
        ctx.lineTo(Game.tower.x - 40, ch);
        ctx.fill();

        // 5. Draw Puck
        ctx.beginPath();
        ctx.arc(Game.puck.x, Game.puck.y, Game.puck.r, 0, Math.PI * 2);
        ctx.fillStyle = '#f97316';
        ctx.shadowColor = '#f97316';
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Puck core
        ctx.beginPath();
        ctx.arc(Game.puck.x, Game.puck.y, Game.puck.r * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();

        // 6. Draw Hammer (Visual representation of pull)
        const currentHammerY = Game.hammer.y + Game.hammer.pull;
        
        // Draw connecting rod (tension string)
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(Game.bell.x, Game.puck.baseY);
        ctx.lineTo(Game.bell.x, currentHammerY);
        ctx.stroke();

        // Hammer head
        ctx.fillStyle = '#52525b';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 10;
        ctx.fillRect(Game.hammer.x, currentHammerY, Game.hammer.w, Game.hammer.h);
        ctx.shadowBlur = 0;

        // Grip indicator on hammer
        ctx.fillStyle = '#f97316';
        ctx.fillRect(Game.hammer.x + Game.hammer.w/2 - 15, currentHammerY + 8, 30, 4);

        // Visual tension indicator (red line showing max pull)
        if (Game.hammer.isDragging) {
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(Game.hammer.x - 20, Game.hammer.y + Game.hammer.maxPull);
            ctx.lineTo(Game.hammer.x + Game.hammer.w + 20, Game.hammer.y + Game.hammer.maxPull);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // 7. Draw Particles
        Game.particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    // Main Game Loop
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // Initialize and Start
    resize();
    loop();

</script>
</body>
</html>
